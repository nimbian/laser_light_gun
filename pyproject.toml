[project]
name = "lightgun"
version = "0.2.0"
description = "Camera-based light gun system: stationary camera watches the screen, guns emit a laser dot."
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyserial>=3.5",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.8",
]
build = [
    "pyinstaller>=6.11",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "PySide6-Essentials>=6.8",
]

[project.scripts]
lightgun = "lightgun.app:main"
lightgun-detect = "lightgun.detect:main"
lightgun-calibrate = "lightgun.calibrate:main"
lightgun-guns = "lightgun.guns:main"

[project.gui-scripts]
lightgun-gui = "lightgun.gui.main_window:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lightgun = ["default_config.toml"]
